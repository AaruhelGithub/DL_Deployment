<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart MCQ Solver</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
  button { padding: 10px 20px; cursor: pointer; }
  #result { white-space: pre-wrap; background: #f5f5f5; padding: 14px; margin-top: 20px; border-radius: 6px; }
  label { font-weight: bold; }
</style>
</head>
<body>
<h1>Smart MCQ Solver</h1>

<label>Prompt / Question</label>
<textarea id="prompt" rows="3"></textarea>

<label>Option A</label><input id="a">
<label>Option B</label><input id="b">
<label>Option C</label><input id="c">
<label>Option D</label><input id="d">
<label>Option E</label><input id="e">

<button onclick="predict()">Solve</button>

<div id="result"></div>

<script>
// Fine-grained, read-only, inference-only token. Do NOT use a token with write/admin scope here —
// this file is public, anyone viewing source can see and copy this token.
const HF_TOKEN = "PASTE_YOUR_FINE_GRAINED_READONLY_TOKEN_HERE";
const MODEL = "facebook/bart-large-mnli";

async function predict() {
  const resultEl = document.getElementById("result");
  resultEl.textContent = "Thinking...";

  const prompt = document.getElementById("prompt").value;
  const options = {
    A: document.getElementById("a").value,
    B: document.getElementById("b").value,
    C: document.getElementById("c").value,
    D: document.getElementById("d").value,
    E: document.getElementById("e").value,
  };
  const labels = Object.values(options).filter(Boolean);

  try {
    const response = await fetch(
      `https://router.huggingface.co/hf-inference/models/${MODEL}`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${HF_TOKEN}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          inputs: prompt,
          parameters: { candidate_labels: labels },
        }),
      }
    );

    if (!response.ok) {
      const errText = await response.text();
      resultEl.textContent = `Error ${response.status}: ${errText}`;
      return;
    }

    const data = await response.json();
    // data.labels and data.scores are parallel arrays, sorted by score descending
    const textToLetter = {};
    for (const [letter, text] of Object.entries(options)) {
      textToLetter[text] = letter;
    }
    const ranked = data.labels.map(l => textToLetter[l] || "?");
    const top3 = ranked.slice(0, 3).join(" ");
    const lines = ranked.map((l, i) => `${i + 1}. ${l} — ${data.scores[i].toFixed(4)}`);
    resultEl.textContent = `Top-3: ${top3}\n\n${lines.join("\n")}`;
  } catch (err) {
    resultEl.textContent = `Request failed: ${err.message}`;
  }
}
</script>
</body>
</html>
